[project]
name = "sz-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jonathan Boidol", email = "jonathan.boidol@sz.de" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.163.1",
    "langchain>=1.5.0",
    "langchain-anthropic>=1.7.10",
    "langchain-openai>=1.8.0",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.5.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
sz-agent = "sz_agent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
